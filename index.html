<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Receipt Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- JsBarcode Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>

    <style>
        /* --- FONTS --- */
        /* Receipt Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&display=swap');
        
        /* Signature Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&display=swap'); /* New Fancy Font */
        @import url('https://fonts.googleapis.com/css2?family=Zeyada&display=swap');

        body {
            overflow: hidden;
            background-color: #f3f4f6;
            touch-action: none;
        }

        /* --- World & Camera System --- */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #world {
            display: flex;
            width: 200vw;
            height: 100vh;
            transform: translateX(-50%); /* Start at POS */
            transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .stage {
            width: 50%;
            height: 100%;
            position: relative;
            overflow-y: auto; 
            display: flex;
            justify-content: center;
        }

        /* --- Receipt Styling --- */
        .receipt-entry {
            transition: all 1.5s ease-out;
            overflow: hidden;
            opacity: 0;
            max-height: 0;
            transform-origin: top center;
            margin-bottom: 0;
            cursor: pointer;
            position: relative;
            padding: 10px;
        }
        
        .receipt-entry.printed {
            opacity: 1;
            max-height: 1500px; 
            margin-bottom: 20px;
        }

        .receipt-paper {
            background-color: #fff;
            color: #1a1a1a;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 340px;
            padding: 24px;
            font-size: 13px;
            line-height: 1.4;
            transition: transform 0.2s;
        }
        
        /* Global Receipt Fonts */
        .font-classic { font-family: 'Courier Prime', monospace; }
        .font-retro { font-family: 'VT323', monospace; font-size: 16px; } 
        .font-modern { font-family: 'Inconsolata', monospace; }

        /* Signature Font Families (Applied to Input) */
        .font-sig-casual { font-family: 'Reenie Beanie', cursive; }
        .font-sig-fancy { font-family: 'Mrs Saint Delafield', cursive; }
        .font-sig-messy { font-family: 'Zeyada', cursive; }

        /* Rendered Signature Styles (Applied to Receipt - includes rotation/size) */
        .render-sig-casual { 
            font-family: 'Reenie Beanie', cursive; 
            font-size: 32px; 
            transform: rotate(-2deg); 
        }
        .render-sig-fancy { 
            font-family: 'Mrs Saint Delafield', cursive; 
            font-size: 42px; /* Larger because this font is naturally small/thin */
            transform: rotate(-5deg); 
            font-weight: 400; /* Ensure it stays thin */
            line-height: 0.8;
        }
        .render-sig-messy { 
            font-family: 'Zeyada', cursive; 
            font-size: 34px; 
            transform: rotate(2deg); 
            font-weight: bold; 
        }

        .receipt-entry:hover .receipt-paper {
            transform: translateY(-2px);
        }

        /* STRONG HIGHLIGHT */
        .receipt-entry.selected .receipt-paper {
            outline: 8px solid #3b82f6; 
            outline-offset: 4px;
            box-shadow: 0 10px 30px -5px rgba(59, 130, 246, 0.6); 
            transform: scale(1.01);
        }

        .receipt-logo {
            max-width: 120px;
            max-height: 80px;
            margin: 0 auto 10px auto;
            display: block;
            filter: grayscale(100%) contrast(120%);
        }
        
        /* Divider Styles */
        .receipt-divider {
            text-align: center;
            font-weight: bold;
            margin: 8px 0;
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
            display: block;
            line-height: 1;
        }

        .handwritten-sig {
            display: inline-block;
            color: #000066; 
        }

        /* --- Printer Structure --- */
        #printer-wrapper {
            position: relative;
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 420px;
            overflow: visible; 
        }

        #printer-cap {
            width: 380px;
            height: 60px;
            background: linear-gradient(to bottom, #2d3748, #1f2937);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            position: relative;
            z-index: 50; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 24px;
        }

        #paper-stream {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 40;
            position: relative;
            top: -5px; 
            padding-top: 0px;
            padding-left: 15px;
            padding-right: 15px;
        }

        #printer-slot-shadow {
            position: absolute;
            bottom: -10px;
            left: 15px;
            width: 350px;
            height: 20px;
            background: black;
            filter: blur(5px);
            z-index: 35;
            opacity: 0.5;
        }

        #printer-lights {
            display: flex;
            gap: 8px;
        }

        /* --- UI Components --- */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        #save-btn-container {
            transition: opacity 0.3s, transform 0.3s, height 0.3s, margin 0.3s;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            height: 0; 
            overflow: hidden;
            margin-bottom: 0;
        }
        #save-btn-container.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
            height: auto;
            margin-bottom: 12px;
        }

        .section-toggle:checked + div {
            background-color: #2563eb;
        }
        .section-toggle:checked + div:after {
            transform: translateX(100%);
            border-color: white;
        }
        .section-card.disabled {
            opacity: 0.6;
        }
        .section-card.disabled .card-body {
            pointer-events: none;
        }
        
        /* Drag Handle Styling */
        .drag-handle {
            cursor: grab;
            color: #9ca3af;
            padding: 0 8px;
        }
        .drag-handle:hover {
            color: #4b5563;
        }
        .sortable-ghost {
            opacity: 0.4;
            background: #e5e7eb;
        }
        
        /* Signature Canvas */
        #sig-canvas {
            background: #fff;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            cursor: crosshair;
            touch-action: none;
        }

        /* Font Buttons Active State */
        .font-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

    </style>
</head>
<body class="text-gray-800 antialiased font-sans">

    <div id="viewport">
        <div id="world">
            
            <!-- STAGE 1: Printer (Output) -->
            <div id="printer-stage" class="stage bg-gray-300 custom-scroll pt-10 pb-40 block">
                <div class="flex justify-center w-full min-h-full">
                    <div id="printer-wrapper">
                        <div id="printer-cap">
                            <div class="absolute left-6 text-gray-500 font-bold text-xs tracking-[0.2em] opacity-50">EPSONIC TM-88</div>
                            <div id="printer-lights">
                                <div class="w-2 h-2 bg-yellow-400 rounded-full"></div>
                                <div class="w-3 h-3 bg-green-500 rounded-full shadow-[0_0_8px_rgba(74,222,128,1)] animate-pulse"></div>
                            </div>
                            <div class="absolute bottom-0 left-0 w-full h-4 bg-gradient-to-b from-black/20 to-transparent pointer-events-none"></div>
                        </div>

                        <div id="paper-stream">
                            <div id="printer-slot-shadow"></div>
                            <!-- Receipts get injected here -->
                        </div>
                    </div>
                </div>

                <div id="printer-actions" class="fixed bottom-0 left-0 w-[50vw] p-6 bg-white/95 backdrop-blur-md border-t border-gray-200 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] flex flex-col items-center justify-center transition-transform duration-500 translate-y-full z-50">
                    <div id="save-btn-container" class="w-full flex justify-center">
                        <button type="button" onclick="saveSelectedReceipts()" id="save-btn-text" class="w-full max-w-sm bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                            <i class="fas fa-download"></i> Save Selected Receipt
                        </button>
                    </div>
                    <button type="button" onclick="backToPos()" class="w-full max-w-sm bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-xl shadow-md transition transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                        <i class="fas fa-plus"></i> Create New Receipt
                    </button>
                </div>
            </div>

            <!-- STAGE 2: POS Monitor (Input) -->
            <div id="pos-stage" class="stage bg-gray-200 flex items-center justify-center">
                <div class="w-full max-w-lg h-full md:h-[95vh] bg-white md:rounded-2xl shadow-2xl flex flex-col overflow-hidden border-[6px] border-gray-800 relative">
                    
                    <!-- App Header -->
                    <div class="bg-gray-800 text-white p-4 flex justify-between items-center shrink-0 z-20 shadow-md">
                        <div class="flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full bg-red-500"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                            <div class="w-3 h-3 rounded-full bg-green-500"></div>
                        </div>
                        <span class="font-bold tracking-widest text-sm text-gray-300">RECEIPT MAKER PRO</span>
                    </div>

                    <!-- Config Content -->
                    <div class="flex-1 overflow-y-auto p-2 md:p-5 custom-scroll bg-gray-50">
                        
                        <!-- Global Settings -->
                        <div class="bg-white p-3 rounded-xl border border-gray-200 mb-4 shadow-sm">
                            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Receipt Font Style</h3>
                            <div class="flex gap-2">
                                <button onclick="setGlobalFont('classic', this)" class="font-btn active flex-1 py-1.5 text-xs font-bold border border-gray-300 rounded font-classic hover:bg-gray-50">Classic</button>
                                <button onclick="setGlobalFont('retro', this)" class="font-btn flex-1 py-1.5 text-xs font-bold border border-gray-300 rounded font-retro hover:bg-gray-50">Retro</button>
                                <button onclick="setGlobalFont('modern', this)" class="font-btn flex-1 py-1.5 text-xs font-bold border border-gray-300 rounded font-modern hover:bg-gray-50">Modern</button>
                            </div>
                        </div>

                        <div id="pos-sections-list" class="space-y-4">

                            <!-- 1. HEADER SECTION -->
                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 section-card" id="card-header" data-section="header">
                                <div class="p-4 border-b border-gray-100 flex justify-between items-center card-header select-none">
                                    <div class="flex items-center">
                                        <i class="fas fa-grip-vertical drag-handle mr-2 text-lg"></i>
                                        <h3 class="text-xs font-extrabold text-gray-400 uppercase tracking-wider"><i class="fas fa-store mr-1"></i> Business Header</h3>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="toggle-header" class="sr-only section-toggle" checked onchange="toggleCardOpacity('card-header', this)">
                                        <div class="w-9 h-5 bg-gray-200 rounded-full peer-focus:outline-none transition-colors after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
                                    </label>
                                </div>
                                <div class="p-4 pt-2 card-body">
                                    <div class="mb-3 flex items-center gap-3">
                                        <div class="w-16 h-16 bg-gray-100 border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center overflow-hidden relative group cursor-pointer" onclick="document.getElementById('logo-upload').click()">
                                            <img id="logo-preview" class="w-full h-full object-contain hidden">
                                            <div id="logo-placeholder" class="text-gray-400 text-xs text-center p-1">Logo</div>
                                            <input type="file" id="logo-upload" accept="image/*" class="hidden" onchange="handleLogoUpload(this)">
                                        </div>
                                        <div class="flex-1">
                                            <textarea id="store-header" rows="2" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-mono focus:bg-white transition" placeholder="Store Name...">Generic Coffee Co.&#10;123 Espresso Lane, NY</textarea>
                                        </div>
                                    </div>
                                    <!-- Divider Config -->
                                    <div class="flex items-center justify-between bg-gray-50 p-2 rounded text-xs border border-gray-100">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" id="div-header-show" class="accent-blue-600" checked>
                                            <span class="font-bold text-gray-500">Add Divider</span>
                                        </label>
                                        <select id="div-header-style" class="bg-white border border-gray-200 rounded px-1 py-0.5 text-xs font-mono">
                                            <option value="dashed">--------</option>
                                            <option value="equals">========</option>
                                            <option value="stars">********</option>
                                            <option value="colons">::::::::</option>
                                            <option value="dots">........</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- 2. EXTRA DETAILS CARD (NEW) -->
                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 section-card" id="card-extra" data-section="extra">
                                <div class="p-4 border-b border-gray-100 flex justify-between items-center card-header select-none">
                                    <div class="flex items-center">
                                        <i class="fas fa-grip-vertical drag-handle mr-2 text-lg"></i>
                                        <h3 class="text-xs font-extrabold text-gray-400 uppercase tracking-wider"><i class="fas fa-align-left mr-1"></i> Extra Details</h3>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="toggle-extra" class="sr-only section-toggle" onchange="toggleCardOpacity('card-extra', this)">
                                        <div class="w-9 h-5 bg-gray-200 rounded-full after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
                                    </label>
                                </div>
                                <div class="p-4 pt-2 card-body">
                                    <div class="flex gap-1 mb-2">
                                        <button onclick="setExtraAlign('left', this)" class="extra-align-btn active flex-1 py-1 border rounded bg-blue-50 text-blue-600 border-blue-200"><i class="fas fa-align-left"></i></button>
                                        <button onclick="setExtraAlign('center', this)" class="extra-align-btn flex-1 py-1 border rounded hover:bg-gray-50"><i class="fas fa-align-center"></i></button>
                                        <button onclick="setExtraAlign('right', this)" class="extra-align-btn flex-1 py-1 border rounded hover:bg-gray-50"><i class="fas fa-align-right"></i></button>
                                        <button onclick="toggleExtraBold(this)" class="flex-1 py-1 border rounded hover:bg-gray-50 font-bold">B</button>
                                    </div>
                                    <textarea id="extra-details-text" rows="4" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-xs font-mono mb-2" placeholder="Entry Time: 10:00 AM&#10;Exit Time: 12:30 PM&#10;License Plate: ABC-123&#10;Zone: A1"></textarea>
                                    
                                    <div class="flex items-center justify-between bg-gray-50 p-2 rounded text-xs border border-gray-100">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" id="div-extra-show" class="accent-blue-600" checked>
                                            <span class="font-bold text-gray-500">Add Divider</span>
                                        </label>
                                        <select id="div-extra-style" class="bg-white border border-gray-200 rounded px-1 py-0.5 text-xs font-mono">
                                            <option value="dashed">--------</option>
                                            <option value="equals">========</option>
                                            <option value="stars">********</option>
                                            <option value="colons">::::::::</option>
                                            <option value="dots">........</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- 3. DATE & ORDER SECTION -->
                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 section-card" id="card-date" data-section="date">
                                <div class="p-4 border-b border-gray-100 flex justify-between items-center card-header select-none">
                                    <div class="flex items-center">
                                        <i class="fas fa-grip-vertical drag-handle mr-2 text-lg"></i>
                                        <h3 class="text-xs font-extrabold text-gray-400 uppercase tracking-wider"><i class="fas fa-calendar mr-1"></i> Date & Order</h3>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="toggle-date" class="sr-only section-toggle" checked onchange="toggleCardOpacity('card-date', this)">
                                        <div class="w-9 h-5 bg-gray-200 rounded-full after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
                                    </label>
                                </div>
                                <div class="p-4 pt-2 card-body">
                                    <div class="grid grid-cols-2 gap-3 mb-3">
                                        <input type="text" id="receipt-date" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-xs font-mono" placeholder="Date">
                                        <input type="text" id="order-no" value="Ord #4922" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-xs font-mono" placeholder="Order #">
                                    </div>
                                    <div class="flex items-center justify-between bg-gray-50 p-2 rounded text-xs border border-gray-100">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" id="div-date-show" class="accent-blue-600" checked>
                                            <span class="font-bold text-gray-500">Add Divider</span>
                                        </label>
                                        <select id="div-date-style" class="bg-white border border-gray-200 rounded px-1 py-0.5 text-xs font-mono">
                                            <option value="dashed">--------</option>
                                            <option value="equals">========</option>
                                            <option value="stars">********</option>
                                            <option value="colons">::::::::</option>
                                            <option value="dots">........</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- 4. META INFO SECTION -->
                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 section-card" id="card-meta" data-section="meta">
                                <div class="p-4 border-b border-gray-100 flex justify-between items-center card-header select-none">
                                    <div class="flex items-center">
                                        <i class="fas fa-grip-vertical drag-handle mr-2 text-lg"></i>
                                        <h3 class="text-xs font-extrabold text-gray-400 uppercase tracking-wider"><i class="fas fa-user-tag mr-1"></i> Transaction Meta</h3>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="toggle-meta" class="sr-only section-toggle" checked onchange="toggleCardOpacity('card-meta', this)">
                                        <div class="w-9 h-5 bg-gray-200 rounded-full after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
                                    </label>
                                </div>
                                <div class="p-4 pt-2 card-body">
                                    <div class="grid grid-cols-3 gap-2 mb-3">
                                        <input type="text" id="server-name" value="Mike" class="p-2 bg-gray-50 border border-gray-200 rounded-lg text-xs" placeholder="Server">
                                        <input type="text" id="station-id" value="POS-01" class="p-2 bg-gray-50 border border-gray-200 rounded-lg text-xs" placeholder="Station ID">
                                        <input type="text" id="guest-count" value="2 Guests" class="p-2 bg-gray-50 border border-gray-200 rounded-lg text-xs" placeholder="Guests">
                                    </div>
                                    <div class="flex items-center justify-between bg-gray-50 p-2 rounded text-xs border border-gray-100">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" id="div-meta-show" class="accent-blue-600" checked>
                                            <span class="font-bold text-gray-500">Add Divider</span>
                                        </label>
                                        <select id="div-meta-style" class="bg-white border border-gray-200 rounded px-1 py-0.5 text-xs font-mono">
                                            <option value="dashed">--------</option>
                                            <option value="equals">========</option>
                                            <option value="stars">********</option>
                                            <option value="colons">::::::::</option>
                                            <option value="dots">........</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- 5. ITEMS SECTION -->
                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 section-card" id="card-items" data-section="items">
                                <div class="p-4 border-b border-gray-100 flex justify-between items-center card-header select-none">
                                    <div class="flex items-center">
                                        <i class="fas fa-grip-vertical drag-handle mr-2 text-lg"></i>
                                        <h3 class="text-xs font-extrabold text-gray-400 uppercase tracking-wider"><i class="fas fa-list mr-1"></i> Item List</h3>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="toggle-items" class="sr-only section-toggle" checked onchange="toggleCardOpacity('card-items', this)">
                                        <div class="w-9 h-5 bg-gray-200 rounded-full after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
                                    </label>
                                </div>
                                <div class="p-4 pt-2 card-body">
                                    <div class="flex justify-end gap-2 mb-2">
                                        <select id="currency-select" class="text-xs border rounded bg-gray-50 px-2 py-1 font-mono">
                                            <option value="$">$ USD</option>
                                            <option value="€">€ EUR</option>
                                            <option value="£">£ GBP</option>
                                            <option value="Ft">Ft HUF</option>
                                        </select>
                                        <button onclick="addItemRow()" class="text-xs bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700 transition"><i class="fas fa-plus"></i></button>

    <template id="item-row-template">

            <input type="text" class="flex-1 p-1.5 bg-gray-50 border border-gray-200 rounded text-xs item-name" value="Item Name">
            <input type="text" class="w-16 p-1.5 bg-gray-50 border border-gray-200 rounded text-xs text-right item-price font-mono" value="0.00" oninput="calculateTotals()">
            <button onclick="removeItem(this)" class="text-gray-400 hover:text-red-500 w-6 h-6 flex items-center justify-center transition"><i class="fas fa-times"></i></button>
        </div>

    <script>
        // State
        let logoDataUrl = null;
        let isPrinting = false;
        let activeReceiptElement = null; 
        let sigMode = 'draw';
        let isDrawing = false;
        let sortableInstance = null;
        let currentReceiptFont = 'font-classic';
        let currentSigFont = 'sig-casual';
        let extraAlign = 'left';
        let extraBold = false;

        // Elements
        const world = document.getElementById('world');
        const itemsContainer = document.getElementById('items-container');
        const template = document.getElementById('item-row-template');
        const paperStream = document.getElementById('paper-stream');
        const printerActions = document.getElementById('printer-actions');
        const saveBtnContainer = document.getElementById('save-btn-container');
        const saveBtnText = document.getElementById('save-btn-text');
        
        // Canvas Setup
        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = "#000066"; // Blue ink
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        // --- Initialization ---
        window.onload = () => {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US') + ' ' + now.toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute:'2-digit'});
            document.getElementById('receipt-date').value = dateStr;

            addItemRow(1, 'Latte Macchiato', '4.50');
            addItemRow(1, 'Blueberry Muffin', '3.75');
            
            toggleCardOpacity('card-sig', document.getElementById('toggle-sig'));
            // Disable Extra details by default
            toggleCardOpacity('card-extra', document.getElementById('toggle-extra'));
            
            // Init Sortable
            const el = document.getElementById('pos-sections-list');
            sortableInstance = Sortable.create(el, {
                handle: '.drag-handle',
                animation: 150,
                ghostClass: 'sortable-ghost'
            });

            // Canvas Listeners
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            
            // Touch support
            canvas.addEventListener('touchstart', (e) => {
                 const touch = e.touches[0];
                 const mouseEvent = new MouseEvent("mousedown", { clientX: touch.clientX, clientY: touch.clientY });
                 canvas.dispatchEvent(mouseEvent); e.preventDefault();
            }, {passive: false});
            canvas.addEventListener('touchmove', (e) => {
                 const touch = e.touches[0];
                 const mouseEvent = new MouseEvent("mousemove", { clientX: touch.clientX, clientY: touch.clientY });
                 canvas.dispatchEvent(mouseEvent); e.preventDefault();
            }, {passive: false});
            canvas.addEventListener('touchend', () => {
                 const mouseEvent = new MouseEvent("mouseup", {}); canvas.dispatchEvent(mouseEvent);
            });
        };
        
        // --- Font Logic ---
        function setGlobalFont(font, btn) {
            currentReceiptFont = 'font-' + font;
            document.querySelectorAll('.font-btn').forEach(b => {
                b.classList.remove('active');
                b.classList.remove('bg-blue-500', 'text-white', 'border-blue-500');
            });
            btn.classList.add('active');
        }

        function setSigFont(font, btn) {
            currentSigFont = 'sig-' + font; // sig-casual, sig-fancy, etc.
            
            document.querySelectorAll('.sig-font-btn').forEach(b => {
                b.classList.remove('active', 'bg-blue-50', 'text-blue-600', 'border-blue-200');
            });
            btn.classList.add('active', 'bg-blue-50', 'text-blue-600', 'border-blue-200');
            
            // Update input preview (Only change font family, NO rotation)
            const input = document.getElementById('sig-input-text');
            // Remove previous font classes
            input.classList.remove('font-sig-casual', 'font-sig-fancy', 'font-sig-messy');
            // Add new font class
            input.classList.add('font-' + currentSigFont);
        }

        // --- Extra Details Logic ---
        function setExtraAlign(align, btn) {
            extraAlign = align;
            document.querySelectorAll('.extra-align-btn').forEach(b => {
                b.classList.remove('active', 'bg-blue-50', 'text-blue-600', 'border-blue-200');
            });
            btn.classList.add('active', 'bg-blue-50', 'text-blue-600', 'border-blue-200');
            document.getElementById('extra-details-text').style.textAlign = align;
        }
        function toggleExtraBold(btn) {
            extraBold = !extraBold;
            if(extraBold) {
                btn.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-200');
                document.getElementById('extra-details-text').classList.add('font-bold');
            } else {
                btn.classList.remove('bg-blue-50', 'text-blue-600', 'border-blue-200');
                document.getElementById('extra-details-text').classList.remove('font-bold');
            }
        }
        
        // --- Signature Logic ---
        function setSigMode(mode) {
            sigMode = mode;
            const drawArea = document.getElementById('sig-draw-area');
            const typeArea = document.getElementById('sig-type-area');
            const btnDraw = document.getElementById('btn-draw');
            const btnType = document.getElementById('btn-type');
            
            if(mode === 'draw') {
                drawArea.classList.remove('hidden'); typeArea.classList.add('hidden');
                btnDraw.classList.add('bg-white', 'shadow-sm', 'text-blue-600'); btnDraw.classList.remove('text-gray-500', 'hover:bg-gray-200');
                btnType.classList.remove('bg-white', 'shadow-sm', 'text-blue-600'); btnType.classList.add('text-gray-500', 'hover:bg-gray-200');
            } else {
                drawArea.classList.add('hidden'); typeArea.classList.remove('hidden');
                btnType.classList.add('bg-white', 'shadow-sm', 'text-blue-600'); btnType.classList.remove('text-gray-500', 'hover:bg-gray-200');
                btnDraw.classList.remove('bg-white', 'shadow-sm', 'text-blue-600'); btnDraw.classList.add('text-gray-500', 'hover:bg-gray-200');
            }
        }
        function clearSig() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function startDrawing(e) { isDrawing = true; draw(e); }
        function stopDrawing() { isDrawing = false; ctx.beginPath(); }
        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        // --- UI Logic ---
        function toggleCardOpacity(cardId, checkbox) {
            const card = document.getElementById(cardId);
            if (!checkbox.checked) card.classList.add('disabled');
            else card.classList.remove('disabled');
        }

        function handleLogoUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    logoDataUrl = e.target.result;
                    document.getElementById('logo-preview').src = logoDataUrl;
                    document.getElementById('logo-preview').classList.remove('hidden');
                    document.getElementById('logo-placeholder').classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function toggleCardDetails() {
            const method = document.getElementById('pay-method').value;
            const cardDetails = document.getElementById('card-details');
            if(method === 'Cash') cardDetails.classList.add('hidden');
            else cardDetails.classList.remove('hidden');
        }

        function addItemRow(qty=1, name='', price='') {
            const clone = template.content.cloneNode(true);
            if(name) clone.querySelector('.item-name').value = name;
            if(price) clone.querySelector('.item-price').value = price;
            clone.querySelector('.item-qty').value = qty;
            itemsContainer.appendChild(clone);
            calculateTotals();
        }

        function removeItem(btn) {
            btn.closest('.item-row').remove();
            calculateTotals();
        }

        function calculateTotals() {
            let subtotal = 0;
            document.querySelectorAll('.item-row').forEach(row => {
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const price = parseFloat(row.querySelector('.item-price').value) || 0;
                subtotal += qty * price;
            });

            const taxRate = parseFloat(document.getElementById('tax-rate-select').value) || 0;
            const taxAmount = subtotal * taxRate;
            const total = subtotal + taxAmount;

            document.getElementById('input-subtotal').value = subtotal.toFixed(2);
            document.getElementById('input-tax').value = taxAmount.toFixed(2);
            document.getElementById('input-total').value = total.toFixed(2);
        }

        // --- Helpers ---
        function getDivider(sectionKey) {
            const show = document.getElementById(`div-${sectionKey}-show`).checked;
            if (!show) return '';
            
            const style = document.getElementById(`div-${sectionKey}-style`).value;
            let pattern = '';
            const len = 60; // Make dividers wider for monospaced fonts
            switch(style) {
                case 'dashed': pattern = '-'.repeat(len); break;
                case 'equals': pattern = '='.repeat(len); break;
                case 'stars':  pattern = '*'.repeat(len); break;
                case 'colons': pattern = ':'.repeat(len); break;
                case 'dots':   pattern = '.'.repeat(len); break;
            }
            return `<div class="receipt-divider">${pattern}</div>`;
        }

        // --- Content Generators by Section ---
        const generators = {
            header: () => {
                if (!document.getElementById('toggle-header').checked) return '';
                let html = '';
                const headerText = document.getElementById('store-header').value.replace(/\n/g, '<br>');
                if(logoDataUrl) html += `<img src="${logoDataUrl}" class="receipt-logo">`;
                html += `<div class="text-center mb-1 font-bold uppercase tracking-wider leading-relaxed text-sm">${headerText}</div>`;
                html += getDivider('header');
                return html;
            },
            extra: () => {
                if (!document.getElementById('toggle-extra').checked) return '';
                let html = '';
                const text = document.getElementById('extra-details-text').value.replace(/\n/g, '<br>');
                const alignClass = `text-${extraAlign}`;
                const boldClass = extraBold ? 'font-bold' : '';
                html += `<div class="mb-2 text-xs leading-relaxed ${alignClass} ${boldClass}">${text}</div>`;
                html += getDivider('extra');
                return html;
            },
            date: () => {
                if (!document.getElementById('toggle-date').checked) return '';
                let html = '';
                const dateVal = document.getElementById('receipt-date').value;
                const orderNo = document.getElementById('order-no').value;
                html += `<div class="flex justify-between text-[11px] uppercase mb-1"><span>${dateVal}</span><span>${orderNo}</span></div>`;
                html += getDivider('date');
                return html;
            },
            meta: () => {
                if (!document.getElementById('toggle-meta').checked) return '';
                let html = '';
                const serverName = document.getElementById('server-name').value;
                const stationId = document.getElementById('station-id').value;
                html += `<div class="flex justify-between text-[11px] uppercase mb-1"><span>Srv: ${serverName}</span><span>Stn: ${stationId}</span></div>`;
                html += getDivider('meta');
                return html;
            },
            items: () => {
                if (!document.getElementById('toggle-items').checked) return '';
                let html = '';
                let itemsHTML = '';
                document.querySelectorAll('.item-row').forEach(row => {
                    const q = row.querySelector('.item-qty').value;
                    const n = row.querySelector('.item-name').value;
                    const p = row.querySelector('.item-price').value;
                    itemsHTML += `
                        <div class="flex justify-between items-start mb-1">
                            <div class="w-8 text-left font-bold">${q}</div>
                            <div class="flex-1 text-left px-1 uppercase leading-tight">${n}</div>
                            <div class="w-14 text-right">${p}</div>
                        </div>
                    `;
                });
                html += `<div class="mb-1 text-xs font-mono mt-2">${itemsHTML}</div>`;
                html += getDivider('items');
                return html;
            },
            fin: () => {
                if (!document.getElementById('toggle-fin').checked) return '';
                let html = '';
                const currency = document.getElementById('currency-select').value;
                const subtotal = document.getElementById('input-subtotal').value;
                const tax = document.getElementById('input-tax').value;
                const total = document.getElementById('input-total').value;
                html += `
                <div class="space-y-1 font-mono text-xs mt-2">
                    <div class="flex justify-between"><span>SUBTOTAL</span><span>${currency}${subtotal}</span></div>
                    <div class="flex justify-between"><span>TAX</span><span>${currency}${tax}</span></div>
                    <div class="flex justify-between text-base font-bold mt-1 pt-1"><span>TOTAL</span><span>${currency}${total}</span></div>
                </div>`;
                html += getDivider('fin');
                return html;
            },
            sig: () => {
                if (!document.getElementById('toggle-sig').checked) return '';
                let html = '';
                html += `<div class="mt-6 mb-4 relative" style="min-height: 60px;">`;
                html += `<div class="absolute bottom-1 left-0 w-full text-[11px] uppercase pl-2 text-gray-500 z-0">x __________________________</div>`;
                html += `<div style="position: absolute; bottom: 5px; left: 20px; z-index: 10;">`;
                if(sigMode === 'draw') {
                    const dataUrl = canvas.toDataURL();
                    html += `<img src="${dataUrl}" style="height: 50px; opacity: 0.9;">`;
                } else {
                    const text = document.getElementById('sig-input-text').value;
                    if(text) {
                        // Apply the correct render class based on selection
                        const renderClass = `render-${currentSigFont}`;
                        html += `<span class="${renderClass} text-[#000066]">${text}</span>`;
                    }
                }
                html += `</div></div>`;
                html += getDivider('sig');
                return html;
            },
            pay: () => {
                if (!document.getElementById('toggle-pay').checked) return '';
                let html = '';
                const currency = document.getElementById('currency-select').value;
                const total = document.getElementById('input-total').value;
                const payMethod = document.getElementById('pay-method').value;
                
                html += `<div class="mt-2 text-[11px] uppercase space-y-1">`;
                if(payMethod !== 'Cash') {
                    const cType = document.getElementById('card-type').value;
                    const cNum = document.getElementById('card-num').value;
                    const auth = document.getElementById('auth-code').value;
                    html += `<div class="flex justify-between"><span>${cType}</span><span>${cNum}</span></div>`;
                    html += `<div class="flex justify-between"><span>Auth Code</span><span>${auth}</span></div>`;
                } else {
                     html += `<div class="flex justify-between"><span>CASH PAYMENT</span><span>${currency}${total}</span></div>`;
                }
                html += `</div>`;
                html += getDivider('pay');
                return html;
            },
            footer: () => {
                if (!document.getElementById('toggle-footer').checked) return '';
                let html = '';
                const footerText = document.getElementById('receipt-footer').value.replace(/\n/g, '<br>');
                html += `<div class="text-center text-xs uppercase mt-4 mb-2 leading-relaxed">${footerText}</div>`;
                html += getDivider('footer');
                
                const codeType = document.getElementById('code-type').value;
                const codeContent = document.getElementById('code-content').value;
                if (codeType === 'barcode') {
                    html += `<svg class="barcode-placeholder flex justify-center mt-4 w-full" data-value="${codeContent}"></svg>`;
                } else if (codeType === 'qr') {
                    html += `<div class="qr-placeholder flex justify-center mt-4 mb-2 grayscale" data-content="${codeContent}"></div>`;
                }
                return html;
            }
        };

        // --- Main Generation Logic ---
        function generateReceiptHTMLContent() {
            let fullHtml = '';
            const sectionCards = document.querySelectorAll('#pos-sections-list .section-card');
            sectionCards.forEach(card => {
                const sectionKey = card.dataset.section;
                if(generators[sectionKey]) {
                    fullHtml += generators[sectionKey]();
                }
            });
            return fullHtml;
        }

        // --- Sequence & Actions ---

        function updateSaveButton() {
            const count = document.querySelectorAll('.receipt-entry.selected').length;
            if (count > 0) {
                saveBtnContainer.classList.add('visible');
                const btnText = count === 1 ? 'Save Selected Receipt' : `Save ${count} Receipts`;
                saveBtnText.innerHTML = `<i class="fas fa-download"></i> ${btnText}`;
            } else {
                saveBtnContainer.classList.remove('visible');
            }
        }

        function printReceipt() {
            if(isPrinting) return;
            isPrinting = true;

            const entryDiv = document.createElement('div');
            entryDiv.className = 'receipt-entry';
            
            const paperDiv = document.createElement('div');
            // Apply Global Font Class
            paperDiv.className = `receipt-paper pb-8 ${currentReceiptFont}`;
            paperDiv.innerHTML = generateReceiptHTMLContent();

            // Post-process QR codes
            const qrPlaceholders = paperDiv.querySelectorAll('.qr-placeholder');
            qrPlaceholders.forEach(el => {
                new QRCode(el, {
                    text: el.dataset.content,
                    width: 96,
                    height: 96,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
                el.classList.remove('qr-placeholder');
            });

            // Post-process Barcodes
            const barcodePlaceholders = paperDiv.querySelectorAll('.barcode-placeholder');
            barcodePlaceholders.forEach(el => {
                try {
                    JsBarcode(el, el.dataset.value, {
                        format: "CODE128",
                        width: 1.5,
                        height: 40,
                        displayValue: true,
                        fontSize: 14,
                        font: "Courier",
                        lineColor: "#000000",
                        marginBottom: 10
                    });
                } catch(e) {
                    console.warn("Barcode error", e);
                }
                el.classList.remove('barcode-placeholder');
            });

            entryDiv.onclick = () => {
                entryDiv.classList.toggle('selected');
                updateSaveButton();
            };

            entryDiv.appendChild(paperDiv);
            paperStream.prepend(entryDiv);

            world.style.transform = "translateX(0%)";
            void entryDiv.offsetWidth; 
            
            setTimeout(() => { entryDiv.classList.add('printed'); }, 800);

            setTimeout(() => {
                printerActions.classList.remove('translate-y-full');
                isPrinting = false;
                entryDiv.click();
            }, 1800);
        }

        function backToPos() {
            printerActions.classList.add('translate-y-full');
            setTimeout(() => { world.style.transform = "translateX(-50%)"; }, 500);
        }

        async function saveSelectedReceipts() {
            const selectedEntries = document.querySelectorAll('.receipt-entry.selected .receipt-paper');
            if (selectedEntries.length === 0) return;
            for (let i = 0; i < selectedEntries.length; i++) {
                await captureAndDownload(selectedEntries[i], i);
                await new Promise(r => setTimeout(r, 500));
            }
        }

        function captureAndDownload(element, index) {
            return new Promise((resolve) => {
                const clone = element.cloneNode(true);
                const container = document.createElement('div');
                container.style.position = 'fixed';
                container.style.left = '-9999px';
                container.style.top = '0';
                container.appendChild(clone);
                document.body.appendChild(container);

                html2canvas(clone, { scale: 3, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `receipt_print_${Date.now()}_${index}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    document.body.removeChild(container);
                    resolve();
                }).catch(err => {
                    console.error(err);
                    document.body.removeChild(container);
                    resolve();
                });
            });
        }
    </script>
